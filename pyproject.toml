[project]
name = "fingerprint-setup"
version = "0.1.0"
description = "Manage fingerprints on Linux, with enrolment that covers your whole fingertip"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
